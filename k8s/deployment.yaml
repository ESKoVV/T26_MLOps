apiVersion: apps/v1
kind: Deployment
metadata:
  name: flight-delay-api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: flight-delay-api
  template:
    metadata:
      labels:
        app: flight-delay-api
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          # Immutable reference: the image CI builds is tagged with the full commit SHA
          # (mlops-flight-delay:${GITHUB_SHA}); pin the pushed digest at release time.
          image: mlops-flight-delay@sha256:REPLACE_WITH_RELEASE_DIGEST
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 2
            failureThreshold: 30
          resources:
            # LR15: one uvicorn worker saturated about one core in the burst profile
            # (10 concurrent clients, ~100 rps); 100m made the 60 % HPA target trip at once.
            requests:
              cpu: 500m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        # readOnlyRootFilesystem needs a writable /tmp, as tmpfs in compose.yaml
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi

